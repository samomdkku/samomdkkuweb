# Nginx site for the KKU VM behind the university reverse proxy.
# Install:
#   sudo cp server/nginx-samo.conf /etc/nginx/sites-available/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# The KKU reverse proxy terminates the public certificate and forwards to
# https://10.101.111.181, so this server listens on 443 with the local
# self-signed cert. `server_name _` is a catch-all (the proxy sets Host).
#
# What this replicates from the Cloudflare Pages setup (public/_headers +
# public/_redirects, which Nginx does NOT read):
#   * /notify        -> local Node service (the Pages Function is gone)
#   * /assets/*       -> immutable long cache (hashed filenames)
#   * /build.json     -> no-store (drives the stale-bundle self-heal)
#   * HTML + /admin/  -> no-cache (or iPad Safari pins a stale bundle)
#   * /admin/*        -> admin SPA index (NOT the public one)
#   * /*              -> public SPA index (client router handles /pr, /news/123, /projects-view)
# Added since:
#   * /vault/         -> Vaultwarden (SAMO's password manager), local container

# Websocket upgrade plumbing for /vault/ (Vaultwarden live sync and "log in
# with device"). `sites-enabled/*` is included inside `http {}`, so this map is
# at http level here and is legal. It must stay OUTSIDE the server block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    root /var/www/samo-web;

    # ── Compression ──────────────────────────────────────────────────────
    # `gzip on` is already set in nginx.conf, and on its own it compresses
    # ONLY text/html — Ubuntu's default gzip_types. Everything that actually
    # weighs anything (JS, CSS, JSON, SVG, fonts) was shipping raw. Measured
    # 2026-09-05 on a cold load of /vault/: 8.26 MB of JavaScript, no
    # Content-Encoding on any of it. The main site's own bundle was uncompressed
    # too, so this was never a Vaultwarden problem — it is the whole host.
    #
    # gzip_proxied matters as much as gzip_types here: by default nginx will not
    # compress a response it PROXIED, which is exactly what /vault/ and /notify
    # are. Without it the vault stays uncompressed however good the type list is.
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;          # 5 is the knee; 6-9 costs CPU for ~2% size
    gzip_min_length 1024;       # below this the header overhead exceeds the win
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript application/json
        application/xml application/rss+xml application/wasm
        image/svg+xml font/ttf font/otf;
    # NOTE: woff/woff2 are already compressed — listing them wastes CPU for ~0.

    # Brotli, where the client supports it (every current browser). Typically
    # 15-20% smaller than gzip on JavaScript, and the web vault is 2.5 MB of it.
    # Needs libnginx-mod-http-brotli-filter installed — without the module these
    # directives are an "unknown directive" error, not a silent no-op, so
    # `nginx -t` catches a box that is missing it rather than serving gzip and
    # letting you believe brotli is on.
    brotli on;
    brotli_comp_level 5;
    brotli_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript application/json
        application/xml application/rss+xml application/wasm
        image/svg+xml font/ttf font/otf;

    # Discord notify — reverse proxy to the local Node service (systemd
    # unit samo-notify). WITHOUT this every notification silently no-ops.
    # Discord OAuth2 callback → the same Node service as /notify.
    # ⚠️ EXACT match, not a prefix. `location /discord/` would hand the whole
    # subtree to the proxy, so a later /discord/anything becomes a route nobody
    # reviewed. One URL is registered with Discord; serve exactly that one.
    location = /discord/config {
        proxy_pass http://127.0.0.1:8787;
    }

    location = /discord/callback {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /notify {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── .mjs is JavaScript ────────────────────────────────────────────────
    # This box's mime.types has no entry for .mjs, so nginx fell through to
    # `default_type application/octet-stream`, and browsers REFUSE a module
    # script served with a non-JS type. The only .mjs Vite emits is pdf.js's
    # worker (`pdfjs-dist/build/pdf.worker.min.mjs?url`), which pdf.js loads as
    # `new Worker(url, {type:'module'})` — so the e-sign modal ("ลงนาม" on a
    # หนังสือโครงการ) has been dead since it shipped, in every browser, and
    # pdf.js's own fallback re-fetches the SAME blocked URL. Measured on
    # production 2026-09-09: module worker → error, dynamic import → "Failed to
    # fetch dynamically imported module", while a .js worker from /assets/
    # loaded and ran. Zero e-sign events exist in the database, ever.
    #
    # A regex location wins over the `location /assets/` prefix below, so this
    # has to restate Cache-Control — dropping it would make the worker
    # uncacheable. `default_type` (not a `types` block) because a types block at
    # this level REPLACES the inherited map rather than extending it.
    #
    # application/javascript is already in gzip_types/brotli_types above, so the
    # 1.3 MB worker also stops shipping uncompressed as a side effect.
    location ~ ^/assets/.+\.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Immutable hashed assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Self-heal source of truth — must never be cached.
    location = /build.json {
        add_header Cache-Control "no-store";
    }

    # Admin SPA — separate build entry, its OWN fallback.
    location /admin/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /admin/index.html;
    }

    # Bare /passport (no trailing slash) doesn't match `location /passport/`,
    # so it would fall through to the catch-all and serve samoweb's index.
    # Redirect it to the canonical trailing-slash path (nginx can't auto-redirect
    # here: there's no `passport` dir under /var/www/samo-web to trigger it).
    location = /passport { return 301 /passport/; }

    # Passport app (separate repo + separate Supabase project), built with
    # base '/passport/'. root /var/www so /passport/... maps to /var/www/passport/...
    location /passport/ {
        root /var/www;
        add_header Cache-Control "no-cache, must-revalidate";
        # $uri.html gives Cloudflare-Pages-style clean URLs: OLD printed QR codes
        # encode the extensionless path (/passport/html/scan?aid=..&tk=..); without
        # this fallback nginx skips scan.html and serves index.html → the scan never
        # runs → no point/activity. New QRs use .../html/scan.html so they resolved
        # already. Keep $uri.html BEFORE the index.html fallback.
        try_files $uri $uri.html $uri/ /passport/index.html;
    }

    # Docs site — SERVED FROM THIS BOX at /docs, not redirected.
    #
    # KKU issues no subdomain (no docs.samo.md.kku.ac.th), so the path on the
    # main host is the only address that reads as official. Serving the real
    # pages here — rather than bouncing to a personal github.io URL — is also
    # the mainstream shape: nextjs.org/docs, tailwindcss.com/docs,
    # supabase.com/docs and kubernetes.io/docs all answer 200 at the path
    # (measured 2026-08-31). stripe.com/docs is the other standard and it
    # redirects to a SUBDOMAIN, which is the option we do not have.
    #
    # Built by server/deploy.sh with DOCS_BASE=/docs/ — a deploy is the only
    # thing that updates these files. GitHub Pages publishes the same docs at
    # the default base on every push, so the documentation survives this VM
    # being down (which matters: documentation is what you read when the thing
    # it documents is broken) — and is also the FRESHER of the two between
    # deploys.
    #
    # `root /var/www` + `location /docs/` maps /docs/x to /var/www/docs/x —
    # identical to the passport block above.
    location = /docs { return 301 /docs/; }

    # The two pages that existed for one day before the site was restructured
    # into docs/start/. Their URLs were handed out, and a link you published is
    # a promise — cheaper to keep than to explain. 301 because these targets are
    # settled, unlike the old /docs redirect which was deliberately temporary.
    location = /docs/CONTRIBUTE   { return 301 /docs/contributing; }
    location = /docs/STEP-BY-STEP { return 301 /docs/start/first-change; }

    location /docs/ {
        root /var/www;
        # VitePress cleanUrls: true — links are extensionless (/docs/CONTRIBUTE)
        # while the file on disk is CONTRIBUTE.html. $uri.html is what bridges
        # them, and it must come BEFORE the directory try, exactly as the
        # passport block needs it for old QR-code paths.
        # `try_files ... /docs/404.html` would serve the 404 PAGE with a 200
        # STATUS — a dead link then looks healthy to every link checker, uptime
        # monitor and crawler, which is the failure mode where you find out from
        # a human months later. `=404` plus `error_page` gives the reader the
        # nice page AND the honest status. Measured: /docs/NOPE answered 200
        # before this line existed.
        error_page 404 /docs/404.html;
        try_files $uri $uri.html $uri/ =404;
        # Hashed assets under /docs/assets/ are immutable; the HTML is not.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /docs/assets/ {
        root /var/www;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }


    # ── Vaultwarden — SAMO's password vault ──────────────────────────────
    #
    # KKU issues no subdomain (same constraint that put the docs at /docs), so
    # a SUBPATH is the only address available. The widely-cited "Android app
    # fails on a subpath" report (vaultwarden#3096) was an INCOMPLETE TLS
    # CHAIN, not the subpath; KKU's edge serves a complete DigiCert chain
    # (`openssl s_client` -> Verify return code: 0), so that cause is absent.
    #
    # ⚠️ location HAS a trailing slash; proxy_pass has NONE. With no URI part
    # on proxy_pass, nginx forwards the ORIGINAL path including /vault/, which
    # is what Vaultwarden expects when DOMAIN carries the subpath. Adding a
    # trailing slash to proxy_pass strips the prefix and every API call 404s
    # while the web vault still loads — i.e. it looks like a Vaultwarden bug.
    location = /vault { return 301 /vault/; }

    location /vault/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Live sync + "log in with device". Whether KKU's edge forwards Upgrade
        # is UNVERIFIED — if it strips it, clients fall back to polling and the
        # vault still works. See skills/vaultwarden.md for the test.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;

        # Attachments and Sends. Vaultwarden enforces its own per-file limits;
        # this only stops nginx rejecting them first with a 413.
        client_max_body_size 525M;

        # ⛔ DO NOT add a blanket Cache-Control here. An earlier version set
        # `no-store` on the whole location "because vault responses are
        # sensitive". Vaultwarden ALREADY sets correct per-route headers —
        # `public, max-age=600` for the app shell, no-store on the sensitive
        # API responses — and nginx's add_header does not replace them, it
        # APPENDS. The response then carried two Cache-Control headers, the
        # browser honoured the strictest, and the entire web vault was
        # re-downloaded on every page load. Measured: server TTFB 0.096s while
        # the app felt slow, which is the signature of a caching problem rather
        # than a server one. The application knows which of its own routes are
        # sensitive; the proxy does not.
    }

    # Public SPA — catch-all, must be last.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Don't serve the inert Cloudflare control files if they linger.
    location ~ /_(headers|redirects)$ { return 404; }
}
