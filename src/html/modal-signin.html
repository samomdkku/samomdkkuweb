  <!-- Sign-in modal.
       The layout is the CONVENTIONAL one on purpose — social button, divider,
       credentials, "no account? sign up" link at the bottom — because an
       unfamiliar sign-in screen costs a beat of "where do I look" on the one
       screen where nobody wants to think. The block comments below mark what is
       REQUIRED rather than chosen. -->
  <div class="modal fade signin-modal" id="signinModal" tabindex="-1" aria-labelledby="signinModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <span class="modal-title fw-bold" id="signinModalLabel">
            <span class="brand-mdkku">MDKKU</span><span class="brand-samo">SAMO</span>
          </span>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="ปิด"></button>
        </div>
        <div class="modal-body signin-body">

          <h2 class="signin-title" id="signinModalTitle">
            <span id="signinTitleLogin">เข้าสู่ระบบ</span>
            <span id="signinTitleRegister" class="d-none">สร้างบัญชี</span>
          </h2>

          <!-- ====== GOOGLE ======
               THIS BUTTON'S APPEARANCE IS NOT A DESIGN CHOICE. Google's "Sign in
               with Google" branding guidelines
               (developers.google.com/identity/branding-guidelines) allow three
               fills only — light #FFFFFF with a #747775 1px stroke, dark
               #131314, neutral #F2F2F2 — and state: "you can't change the size
               or color of the Google 'G' logo. It must be the standard color
               version ... and appear on a white background." Following them is
               required for app verification.

               This button used to be brand-green with a monochrome Bootstrap
               glyph, which broke both rules — and that is also why it did not
               READ as a Google button. Every other site a person has signed into
               shows the white button with the four-colour G, and the researched
               pattern agrees: a coloured logo on white is easier to pick out
               than a wall of coloured buttons.

               The G is inlined as SVG rather than an <img>: no network request,
               no CSP question, and it cannot go missing.

               NO CAPTION UNDER THIS BUTTON. Four separate reports said the copy
               made Google look KKU-only, and every rewrite kept a parenthesised
               domain list because KKU students were assumed to scan for it. A
               LIST OF DOMAINS IS READ AS A WHITELIST however the sentence around
               it is phrased: "ทั้ง Gmail ของบุคคลทั่วไป และอีเมล มข.
               (@kkumail.com, @kku.ac.th)" still left a glancer sure a @gmail.com
               address was not welcome, because the only literal addresses on
               screen were the two KKU ones. The standard button carries no
               caption anywhere else on the web, and a line that does not exist
               cannot be misread. Do not reintroduce one — signin-screen.test.js
               fails if an email domain appears in this modal. -->
          <button type="button" class="signin-google" onclick="samoGoogleSignIn()">
            <svg class="signin-google-g" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.07H2.18a11 11 0 0 0 0 9.86l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 0 0-9.82 6.07l3.66 2.83C6.71 7.31 9.14 5.38 12 5.38z"/>
            </svg>
            <!-- "สมัครและเข้าสู่ระบบ", not just "เข้าสู่ระบบ". A first-time
                 visitor does not know that Google needs no registration here —
                 signing in with Google CREATES the account — so a button that
                 only says "เข้าสู่ระบบ" reads as "for people who already have an
                 account", and they go looking for a สมัคร link. That is what
                 sent them to the anonymous route.
                 Google's guidelines recommend "Sign in / Sign up / Continue
                 with Google" and permit localization; this merges two of the
                 three — the one-button-does-both case is exactly what
                 "Continue with Google" exists for.

                 "สร้างบัญชี", not "สมัคร", because this screen now uses ONE verb
                 for creating an account: the register screen's title, its submit
                 button and the anonymous link all say สร้างบัญชี. Two words for
                 one action is a thing a newcomer has to resolve before acting.
                 Google's own Thai string is "ลงชื่อเข้าใช้ด้วย Google", which is
                 deliberately NOT used: this site says เข้าสู่ระบบ everywhere, and
                 a third verb for the same action costs more than matching
                 Google's wording gains.

                 ⚠ IT IS LONG. Measured: 231px of text in a 337px button at
                 390px (fine), but at 320px it WRAPS to two lines and a wrapped
                 social button looks broken — hence the font step in cards.css
                 under 360px. Re-measure if you edit this string. -->
            <span>สร้างบัญชีและเข้าสู่ระบบด้วย Google</span>
          </button>
          <!-- Sits outside both panels — the Google button above is visible on
               either screen, so its error needs to be too. Was a native
               alert(), which goes silent for the rest of the page once Chrome's
               "prevent this page from creating additional dialogs" is ticked
               (reachable by retrying a failed Google sign-in a couple of
               times). Also shown by account-switch.js's saved-account picker,
               which has no modal open at the moment Google fails. -->
          <div id="signinGoogleAlert" class="alert alert-danger signin-alert d-none" role="alert"></div>

          <div class="signin-divider"><span>หรือ</span></div>

          <!-- ====== USERNAME / PASSWORD ======
               Plain stacked fields — no tinted card, no segmented control. The
               previous pass boxed this route in a green panel with tabs, which
               read as a second app bolted underneath and is the friction the
               owner described. Every familiar sign-in puts the credentials
               directly under the divider and the account switch as a text link
               at the bottom.

               THE LINK NAMES THE ROUTE. Its earlier wording — "ยังไม่มีบัญชี
               ชื่อผู้ใช้?" — never said the account is the ANONYMOUS one, so the
               only fact about this route was absent at the moment somebody chose
               it. The register screen's heading says it too. -->
          <div id="signinLoginScreen">
            <form id="signinLoginForm" onsubmit="event.preventDefault(); samoPasswordSignIn();">
              <div class="signin-field">
                <label class="signin-label" for="signinLoginUsername">ชื่อผู้ใช้</label>
                <input type="text" class="form-control signin-input" id="signinLoginUsername"
                  autocomplete="username" required>
              </div>
              <div class="signin-field">
                <label class="signin-label" for="signinLoginPassword">รหัสผ่าน</label>
                <div class="signin-input-wrap">
                  <input type="password" class="form-control signin-input" id="signinLoginPassword"
                    autocomplete="current-password" required>
                  <button type="button" class="signin-reveal" data-signin-reveal="signinLoginPassword"
                    aria-label="แสดงรหัสผ่าน" aria-pressed="false">
                    <i class="bi bi-eye-slash" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
              <div id="signinLoginAlert" class="alert alert-danger signin-alert d-none" role="alert"></div>
              <button type="submit" class="btn signin-submit" id="signinLoginBtn">เข้าสู่ระบบ</button>
            </form>
            <!-- NOT "ยังไม่มีบัญชี?". That question is true of EVERY first-time
                 visitor, including the ones who should just press the Google
                 button — signing in with Google creates the account implicitly,
                 so those people never need to "สร้างบัญชี" at all. Read cold, the
                 generic phrasing tells a newcomer they must sign up first, which
                 is the fifth report in this family: copy that describes a STATE
                 the reader is in gets taken as an instruction.

                 The question names the WANT instead. A Google user reads
                 "ไม่ต้องการเปิดเผยตัวตน?", answers "no", and moves on; the person
                 who does want it finds the route by the words they were looking
                 for, at the front of the line. -->
            <p class="signin-switch">
              ไม่ต้องการเปิดเผยตัวตน?
              <a href="#" onclick="event.preventDefault(); samoShowSigninScreen('register');">สร้างบัญชีด้วยชื่อผู้ใช้</a>
            </p>
          </div>

          <div id="signinRegisterScreen" class="d-none">
            <!-- The title above stays generic because Google sits ABOVE this
                 divider and is a perfectly good way to create an account too —
                 titling the whole screen "แบบไม่เปิดเผยตัวตน" while offering
                 Google first contradicts itself. The anonymity belongs to THIS
                 half, so it is stated here, next to the fields it describes. -->
            <p class="signin-lede">บัญชีแบบไม่เปิดเผยตัวตน ไม่ต้องใช้อีเมล</p>
            <form id="signinRegisterForm" onsubmit="event.preventDefault(); samoPasswordRegister();">
              <div class="signin-field">
                <label class="signin-label" for="signinRegisterUsername">ชื่อผู้ใช้</label>
                <input type="text" class="form-control signin-input" id="signinRegisterUsername"
                  autocomplete="username" required minlength="3" aria-describedby="signinRegisterUsernameHelp">
                <!-- The rules live in TEXT THAT STAYS, not in a placeholder: a
                     placeholder disappears at the first keystroke, which is
                     exactly when the rule starts to matter. -->
                <p class="signin-help" id="signinRegisterUsernameHelp">อย่างน้อย 3 ตัวอักษร</p>
              </div>
              <div class="signin-field">
                <label class="signin-label" for="signinRegisterPassword">รหัสผ่าน</label>
                <div class="signin-input-wrap">
                  <input type="password" class="form-control signin-input" id="signinRegisterPassword"
                    autocomplete="new-password" required minlength="6"
                    aria-describedby="signinRegisterPasswordHelp">
                  <button type="button" class="signin-reveal" data-signin-reveal="signinRegisterPassword"
                    aria-label="แสดงรหัสผ่าน" aria-pressed="false">
                    <i class="bi bi-eye-slash" aria-hidden="true"></i>
                  </button>
                </div>
                <!-- 6, because auth.js registerWithPassword() rejects 5. This
                     said 4 for months, so the form invited a password the code
                     then refused; signin-screen.test.js reads the number out of
                     auth.js and compares. -->
                <p class="signin-help" id="signinRegisterPasswordHelp">อย่างน้อย 6 ตัวอักษร</p>
              </div>
              <div class="signin-field">
                <label class="signin-label" for="signinRegisterConfirm">ยืนยันรหัสผ่าน</label>
                <input type="password" class="form-control signin-input" id="signinRegisterConfirm"
                  autocomplete="new-password" required>
              </div>
              <div id="signinRegisterAlert" class="alert alert-danger signin-alert d-none" role="alert"></div>
              <button type="submit" class="btn signin-submit" id="signinRegisterBtn">สร้างบัญชี</button>
            </form>
            <p class="signin-switch">
              มีบัญชีอยู่แล้ว?
              <a href="#" onclick="event.preventDefault(); samoShowSigninScreen('login');">เข้าสู่ระบบ</a>
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>
