# CI: build + unit tests on every PR + push to main / refactor branches.
#
# What runs:
# - npm run lint  — ESLint, CORRECTNESS rules only (no-undef, no-unused-vars,
#                  no-unreachable, ...). No style/formatting rule is enabled;
#                  see eslint.config.mjs's header for why each rule is on.
# - npm test     — Vitest suite for pure helpers (escHtml, safeUrl,
#                  convertDriveUrl, formatThaiDate, decodeJwtResponse).
#                  Cheap (~150 ms) and catches regressions in the
#                  security-critical escape/url-sanitize helpers.
# - npm run build — Vite, fails on syntax / module-resolution errors.
#
# Cloudflare Pages also builds on push; this CI gives a faster signal
# on PRs and is what GitHub's required-status-check rule on `main`
# protects against.
#
# Formatting/style rules are still deferred until a real disagreement exists
# between contributors — only lint's correctness rules are required here.

name: build

on:
  push:
    branches: [main, refactor/modular]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history. state-handoff.test.js resolves the sha STATE.md
          # names as deployed, and the default depth-1 checkout has only the
          # tip commit — so the guard reported every correct sha as "not a
          # commit in this repo" and held `main` red from 2026-08-28.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Node 22 — supabase-js/realtime-js (imported transitively by
          # src/js/db.js, which the Vitest suite loads) hard-throws
          # "Node.js 20 detected without native WebSocket support" at import
          # time on Node 20, which has no global WebSocket. Node 22 ships a
          # stable global WebSocket, so `npm test` passes. (Build-only steps
          # never execute db.js, but tests do.)
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      # We don't need real env vars at build time; Vite's import.meta.env
      # access doesn't fail if vars are missing — db.js only logs a warning.
      - run: npm test
      - run: npm run build
      # check:bundle reads dist/, so it runs after the build. Added in review
      # (2026-10-31): the night agent wrote the guard but nothing ran it.
      - run: npm run check:bundle
      # The docs site is the AUTHORITATIVE guard for markdown that renders
      # wrong. `src/js/md-raw-tags.test.js` is a fast local approximation of
      # the same rule and has been fooled three times; the Vue compiler has
      # not. This step is inside the REQUIRED `build` check on purpose, so a
      # doc that would break the published site cannot merge.
      - run: npm run docs:build
      # THE ฝ่าย TOOL BOUNDARY, and it lives HERE on purpose (DEPT-TOOLS §8.3).
      # A `tool/*` branch may reach only public/embed/<slug>/ plus the one
      # registry file — that limit is what makes a PEER approval of code they
      # cannot fully read a safe thing to accept.
      #
      # It is a step inside the REQUIRED `build` job rather than a workflow of
      # its own, because a separate required check would have nothing to report
      # on every branch that is not tool/*, and this repo has already blocked
      # `main` for a day that way (tools/repo-protection.mjs's last assertion).
      # On any other branch the script says so and exits 0.
      - run: npm run check:tool-boundary
        env:
          SAMO_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          SAMO_BASE_REF: origin/${{ github.base_ref || 'main' }}
      # Every routed ฝ่าย tool folder still obeys the lane's rules. Cheap, and
      # it is the check a contributor can run alone: npm run check:embeds
      - run: npm run check:embeds
